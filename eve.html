<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humano Real Caminando en Calle - Bucle HD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #000;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. Fondo fotorrealista de la calle */
        .street-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: brightness(0.85) contrast(1.1);
            z-index: 1;
        }

        /* 2. Sombra fotorrealista sobre el asfalto */
        .shadow {
            position: absolute;
            bottom: 12%;
            width: 220px;
            height: 35px;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 50%;
            filter: blur(12px);
            z-index: 2;
            animation: shadowBounce 0.8s infinite alternate ease-in-out;
        }

        @keyframes shadowBounce {
            0% { transform: scale(0.95); opacity: 0.6; }
            100% { transform: scale(1.05); opacity: 0.8; }
        }

        /* 3. Humano Real en Video Bucle (Transparente/Keyed) */
        .human-video {
            position: absolute;
            bottom: 10%;
            height: 75vh;
            max-height: 700px;
            z-index: 3;
            object-fit: contain;
            /* Mezcla fotorrealista con la escena */
            filter: drop-shadow(0px 15px 10px rgba(0,0,0,0.4));
        }

        /* Interfaz Overlay */
        .overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-size: 14px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f2fe;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- Fondo de Calle Real -->
        <div class="street-bg"></div>

        <!-- Sombra del cuerpo -->
        <div class="shadow"></div>

        <!-- Humano real grabado caminando en bucle continuo -->
        <video class="human-video" autoplay loop muted playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-man-walking-on-a-green-screen-40824-large.mp4" type="video/mp4">
            Tu navegador no soporta reproducción de video.
        </video>

        <div class="overlay">
            <div class="dot"></div>
            <span>Estado: <strong style="color:#00f2fe;">Caminando en bucle HD continuo</strong></span>
        </div>
    </div>

</body>
</html>
