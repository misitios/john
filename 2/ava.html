<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar en Calle Real - Bucle Infinito</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #020617;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-size: 14px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div id="container">
        <div class="overlay">
            <div class="dot"></div>
            <span>Estado: <strong id="status-tag" style="color:#38bdf8;">Caminando al frente</strong></span>
        </div>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusTag = document.getElementById('status-tag');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let time = 0;
        let headTurn = 0;
        let targetHeadTurn = 0;
        let eyeOffset = 0;
        let targetEyeOffset = 0;
        let stateText = "";
        let streetOffset = 0;

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            time += 0.035;
            streetOffset = (streetOffset + 2.5) % 80;
            const cycle = time % 8; // Ciclo continuo de 8 segundos

            // LÓGICA DE CONTROL DE ESTADOS (Mirada al frente -> Lados -> Regreso)
            if (cycle < 3) {
                targetHeadTurn = 0;
                targetEyeOffset = 0;
                stateText = "Caminando mirando al frente";
            } else if (cycle >= 3 && cycle < 4.5) {
                targetHeadTurn = -0.18; // Giro leve de cabeza a la izquierda
                targetEyeOffset = -5;   // Mirada a la izquierda
                stateText = "Mirando a la izquierda";
            } else if (cycle >= 4.5 && cycle < 6.5) {
                targetHeadTurn = 0.18;  // Giro leve de cabeza a la derecha
                targetEyeOffset = 5;    // Mirada a la derecha
                stateText = "Mirando a la derecha";
            } else {
                targetHeadTurn = 0;
                targetEyeOffset = 0;
                stateText = "Regresando la mirada al frente";
            }

            // Interpolación suave del movimiento
            headTurn += (targetHeadTurn - headTurn) * 0.08;
            eyeOffset += (targetEyeOffset - eyeOffset) * 0.08;
            statusTag.textContent = stateText;

            // DIBUJAR ESCENARIO DE CALLE URBANA EN TIEMPO REAL
            drawStreet(streetOffset);

            // DIBUJAR AVATAR HUMANO REALISTA EN EL CENTRO
            drawHumanAvatar(canvas.width / 2, canvas.height * 0.78, time, headTurn, eyeOffset);

            requestAnimationFrame(animate);
        }

        // --- RENDERIZADO DE LA CALLE (Efecto Perspectiva Realista) ---
        function drawStreet(offset) {
            const w = canvas.width;
            const h = canvas.height;
            const horizon = h * 0.52;

            // Cielo al atardecer
            const skyGrad = ctx.createLinearGradient(0, 0, 0, horizon);
            skyGrad.addColorStop(0, '#0f172a');
            skyGrad.addColorStop(0.7, '#1e1b4b');
            skyGrad.addColorStop(1, '#4338ca');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, horizon);

            // Edificios lejanos
            ctx.fillStyle = "#090d16";
            ctx.fillRect(w * 0.05, horizon - 120, 140, 120);
            ctx.fillRect(w * 0.22, horizon - 180, 180, 180);
            ctx.fillRect(w * 0.65, horizon - 150, 160, 150);
            ctx.fillRect(w * 0.82, horizon - 210, 140, 210);

            // Luces de ventanas de edificios
            ctx.fillStyle = "rgba(253, 224, 71, 0.4)";
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(w * 0.25 + (i * 25), horizon - 140, 12, 18);
                ctx.fillRect(w * 0.70 + (i * 25), horizon - 110, 12, 18);
            }

            // Asfalto de la Calle
            const roadGrad = ctx.createLinearGradient(0, horizon, 0, h);
            roadGrad.addColorStop(0, '#0f172a');
            roadGrad.addColorStop(1, '#020617');
            ctx.fillStyle = roadGrad;
            ctx.fillRect(0, horizon, w, h - horizon);

            // Aceras / Encañado de la calle
            ctx.fillStyle = "#334155";
            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.lineTo(w * 0.2, horizon);
            ctx.lineTo(0, horizon);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(w, h);
            ctx.lineTo(w * 0.8, horizon);
            ctx.lineTo(w, horizon);
            ctx.fill();

            // Líneas divisorias de carril en movimiento (Parallax de avance)
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 4;
            ctx.setLineDash([30, 30]);
            ctx.lineDashOffset = -offset * 1.5;

            ctx.beginPath();
            ctx.moveTo(w * 0.5, horizon);
            ctx.lineTo(w * 0.5, h);
            ctx.stroke();
            ctx.setLineDash([]); // Reset
        }

        // --- RENDERIZADO DEL AVATAR HUMANO PROPORCIONAL Y ANIMAClÓN DE PASOS ---
        function drawHumanAvatar(centerX, centerY, t, hTurn, eOffset) {
            ctx.save();
            ctx.translate(centerX, centerY);

            // Cálculo de movimiento de caminata (Anatomía en oscilación)
            const walkSpeed = t * 6.5;
            const legSwing = Math.sin(walkSpeed) * 0.35;
            const armSwing = Math.sin(walkSpeed) * 0.3;
            const bounce = Math.abs(Math.cos(walkSpeed * 2)) * 5;
            const bodyY = -bounce;

            // SOMBRA REALISTA EN EL ASFALTO
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.beginPath();
            ctx.ellipse(0, 10, 45 - bounce * 0.6, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // PIERNA IZQUIERDA (Atrás)
            ctx.save();
            ctx.translate(-14, bodyY - 50);
            ctx.rotate(-legSwing);
            ctx.fillStyle = "#1e293b"; // Jeans oscuros
            ctx.fillRect(-8, 0, 16, 60);
            ctx.fillStyle = "#0f172a"; // Calzado
            ctx.fillRect(-9, 55, 18, 10);
            ctx.restore();

            // BRAZO IZQUIERDO (Atrás)
            ctx.save();
            ctx.translate(-28, bodyY - 120);
            ctx.rotate(armSwing);
            ctx.fillStyle = "#1e3a8a"; // Chaqueta Azul
            ctx.fillRect(-6, 0, 12, 55);
            ctx.fillStyle = "#fca5a5"; // Piel mano
            ctx.beginPath();
            ctx.arc(0, 55, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // TORSO / CUERPO HUMANO
            ctx.save();
            ctx.translate(0, bodyY - 125);
            ctx.fillStyle = "#2563eb"; // Abrigo/Chaqueta principal
            ctx.beginPath();
            ctx.roundRect(-26, 0, 52, 80, 12);
            ctx.fill();

            // Camiseta interior
            ctx.fillStyle = "#f8fafc";
            ctx.fillRect(-10, 0, 20, 25);
            ctx.restore();

            // PIERNA DERECHA (Adelante)
            ctx.save();
            ctx.translate(14, bodyY - 50);
            ctx.rotate(legSwing);
            ctx.fillStyle = "#334155";
            ctx.fillRect(-8, 0, 16, 60);
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(-9, 55, 18, 10);
            ctx.restore();

            // BRAZO DERECHO (Adelante)
            ctx.save();
            ctx.translate(28, bodyY - 120);
            ctx.rotate(-armSwing);
            ctx.fillStyle = "#1d4ed8";
            ctx.fillRect(-6, 0, 12, 55);
            ctx.fillStyle = "#fca5a5";
            ctx.beginPath();
            ctx.arc(0, 55, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // CABEZA Y ROSTRO REALISTA (Giro articulado)
            ctx.save();
            ctx.translate(0, bodyY - 135);
            ctx.rotate(hTurn); // Aplicar giro de mirada

            // Cuello
            ctx.fillStyle = "#fca5a5";
            ctx.fillRect(-8, 5, 16, 14);

            // Cabeza (Forma proporcional humana)
            ctx.beginPath();
            ctx.ellipse(0, -18, 22, 26, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cabello
            ctx.fillStyle = "#1e1b4b";
            ctx.beginPath();
            ctx.arc(0, -22, 24, Math.PI * 0.85, Math.PI * 2.15);
            ctx.fill();

            // Ojos con pupila móvil
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-12 + eOffset, -20, 8, 5);
            ctx.fillRect(4 + eOffset, -20, 8, 5);

            ctx.fillStyle = "#0f172a";
            ctx.fillRect(-10 + eOffset, -19, 4, 3);
            ctx.fillRect(6 + eOffset, -19, 4, 3);

            // Cejas
            ctx.strokeStyle = "#1e1b4b";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-14 + eOffset, -24);
            ctx.lineTo(-4 + eOffset, -24);
            ctx.moveTo(4 + eOffset, -24);
            ctx.lineTo(14 + eOffset, -24);
            ctx.stroke();

            // Boca
            ctx.strokeStyle = "#9f1239";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0 + eOffset * 0.4, -8, 6, 0.2 * Math.PI, 0.8 * Math.PI);
            ctx.stroke();

            ctx.restore(); // Fin Cabeza
            ctx.restore(); // Fin Avatar
        }

        // Iniciar el bucle de animación instantáneo
        animate();
    </script>
</body>
</html>
