<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>SPECTHER - Agencia Web Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Librerías para Kinetic Typography & Parallax 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

    <style>
        :root {
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;

            --bg-sec1: #0A0B10;
            --border-sec1: rgba(255, 255, 255, 0.06);
            --s1-accent: #3b82f6;
            --s1-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);

            --bg-sec2: #0f121d;
            --border-sec2: rgba(6, 182, 212, 0.15);

            --bg-sec3: #05080e;
            --border-sec3: rgba(16, 185, 129, 0.15);

            --navy-accent: #3b82f6;
            --navy-1: linear-gradient(135deg, #0b1c3a, #2563eb);
            --navy-2: linear-gradient(135deg, #14275a, #3b82f6);
            --navy-3: linear-gradient(135deg, #1e3a8a, #60a5fa);
            --navy-4: linear-gradient(135deg, #0f2247, #1d4ed8);
            --navy-border: rgba(59, 130, 246, 0.18);
            --navy-deep: #14275a;
            --navy-light: #60a5fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #020204;
            background-image:
                linear-gradient(180deg, rgba(2,2,4,0.82), rgba(2,2,4,0.9)),
                url('https://misitios.github.io/john/imagen/fondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .card-container {
            background-color: var(--bg-sec1);
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.05);
            overflow: hidden;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            perspective: 1000px;
        }

        /* ----- PANTALLA INTRO KINÉTICA DE CARGA ----- */
        .intro-screen {
            position: absolute;
            inset: 0;
            z-index: 999;
            background: #020204;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            pointer-events: none;
        }

        .intro-name {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .intro-role {
            font-size: 13px;
            font-weight: 700;
            color: var(--s1-accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .kinetic-char {
            display: inline-block;
            will-change: transform, opacity;
        }

        .top-app-bar {
            width: 100%;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bg-sec1);
            border-bottom: 1px solid var(--border-sec1);
            padding-left: 3.5%;
            padding-right: 3.5%;
        }

        .call-consult-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 14px 0 16px 0;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border-sec1);
        }

        .fixed-btn {
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 11.5px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-radius: 14px;
            transition: transform 0.2s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .btn-call {
            background: linear-gradient(135deg, #161925, #0f111a);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-call i { color: var(--s1-accent); }
        .fixed-btn:active { transform: scale(0.96); }

        .btn-chat {
            background: var(--s1-gradient);
        }

        /* Header con Parallax 3D */
        .top-bar-main {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 14px 0 18px 0;
            padding: 22px 18px;
            background: linear-gradient(150deg, #1a1d27, #101218);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 26px;
            box-shadow: 0 14px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .top-bar-main::before {
            content: '';
            position: absolute;
            top: 0;
            left: 18px;
            right: 18px;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
        }

        .top-bar-avatar {
            flex-shrink: 0;
            width: 146px;
            height: 146px;
            border-radius: 28px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 24px rgba(0,0,0,0.45);
            background-color: #1f2937;
            transform: translateZ(30px);
        }
        .top-bar-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 40% 20%;
        }

        .top-bar-identity {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            transform: translateZ(20px);
        }
        .top-bar-brand {
            font-family: 'Comfortaa', cursive;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-bar-name {
            font-size: 27px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .top-bar-role {
            color: var(--s1-accent);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 5px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transform: translateZ(15px);
        }

        .tab-content {
            width: 100%;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            padding-bottom: 78px;
        }
        .tab-content::-webkit-scrollbar { display: none; }

        .tab-panel {
            display: none;
            width: 100%;
            min-height: 100%;
            flex-direction: column;
        }
        .tab-panel.active {
            display: flex;
            animation: panelFadeIn 0.35s ease;
        }
        @keyframes panelFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .opt-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 22px 3.5% 8px 3.5%;
            position: relative;
        }

        .opt-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-sec1);
            border-radius: 20px;
            color: var(--text-main);
            cursor: pointer;
            text-align: center;
            padding: 10px;
            font-family: inherit;
            transition: border-color 0.2s ease, background 0.2s ease;
            transform-style: preserve-3d;
        }
        .opt-cell i {
            font-size: 30px;
            background: var(--s1-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            transform: translateZ(20px);
        }
        .opt-cell span {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.3;
            transform: translateZ(15px);
        }

        .opt-eyebrow { padding: 24px 3.5% 0 3.5%; }
        .opt-eyebrow .sig-name { font-size: 15px; font-weight: 700; color: #fff; }
        .opt-eyebrow .opt-eyebrow-sub {
            color: var(--text-muted);
            font-size: 11.5px;
            line-height: 1.6;
            margin-top: 6px;
        }

        .bottom-nav {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 25;
            display: flex;
            width: 100%;
            background: var(--bg-sec1);
            border-top: 1px solid var(--border-sec1);
            box-shadow: 0 -10px 24px rgba(0,0,0,0.4);
            padding: 8px 3.5% 10px 3.5%;
        }
        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-decoration: none;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-radius: 14px;
            padding: 6px 2px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.2px;
            cursor: pointer;
        }
        .nav-btn i { font-size: 25px; color: var(--s1-accent); }
        .nav-btn.active {
            color: #ffffff;
            background: rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body>

    <div class="card-container">

        <!-- Pantalla de Carga Kinética (Máx 1.5 - 2s) -->
        <div class="intro-screen" id="introScreen">
            <h1 class="intro-name" id="introName">John Garzón</h1>
            <p class="intro-role" id="introRole">Director Specther Group</p>
        </div>

        <div class="top-app-bar">
            <div class="call-consult-row">
                <a href="tel:+573024196999" class="fixed-btn btn-call">
                    <i class="fa-solid fa-phone-flip"></i>
                    Llamar
                </a>
                <a href="https://wa.me/573024196999" target="_blank" class="fixed-btn btn-chat">
                    <i class="fa-solid fa-circle-nodes"></i>
                    Consultoría
                </a>
            </div>

            <div class="top-bar-main" data-tilt data-tilt-max="12" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.2">
                <div class="top-bar-avatar">
                    <img src="https://misitios.github.io/john/imagen/perfil.jpg" alt="John Garzón">
                </div>
                <div class="top-bar-identity">
                    <div class="top-bar-brand">Specther Group</div>
                    <h1 class="top-bar-name">John Garzón</h1>
                    <p class="top-bar-role">Director Specther Group</p>
                </div>
            </div>
        </div>

        <div class="tab-content">
            <div class="tab-panel active" id="panel-portfolio">
                <div class="opt-eyebrow">
                    <span class="sig-name">Proyectos</span>
                    <p class="opt-eyebrow-sub">Portafolio de inversión y desarrollo, resultado de más de 15 años de trayectoria en dirección de proyectos multinacionales.</p>
                </div>

                <div class="opt-grid">
                    <button type="button" class="opt-cell" data-tilt data-tilt-scale="1.05">
                        <i class="fa-solid fa-city"></i>
                        <span>Bienes Raíces</span>
                    </button>
                    <button type="button" class="opt-cell" data-tilt data-tilt-scale="1.05">
                        <i class="fa-solid fa-coins"></i>
                        <span>Inversiones de Capital</span>
                    </button>
                    <button type="button" class="opt-cell" data-tilt data-tilt-scale="1.05">
                        <i class="fa-solid fa-microchip"></i>
                        <span>Proyectos de Tecnología</span>
                    </button>
                    <button type="button" class="opt-cell" data-tilt data-tilt-scale="1.05">
                        <i class="fa-solid fa-hand-holding-heart"></i>
                        <span>ONG</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn active">
                <i class="fa-solid fa-layer-group"></i>
                <span>Portafolio</span>
            </button>
        </div>

    </div>

    <script>
        // Función para fragmentar texto en caracteres individuales
        function prepareKineticText(elementId) {
            const el = document.getElementById(elementId);
            const text = el.innerText;
            el.innerHTML = '';
            text.split('').forEach(char => {
                const span = document.createElement('span');
                span.className = 'kinetic-char';
                span.innerHTML = char === ' ' ? '&nbsp;' : char;
                el.appendChild(span);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Fragmentar nombre y cargo
            prepareKineticText('introName');
            prepareKineticText('introRole');

            const tl = gsap.timeline();

            // Animación de entrada con tipografía kinética (duración aprox. 1.2s)
            tl.fromTo('#introName .kinetic-char', 
                { opacity: 0, scale: 0.2, rotationX: -90, y: 20 },
                { opacity: 1, scale: 1, rotationX: 0, y: 0, duration: 0.6, stagger: 0.03, ease: 'back.out(2)' }
            )
            .fromTo('#introRole .kinetic-char', 
                { opacity: 0, scale: 0.2, rotationX: -90, y: 15 },
                { opacity: 1, scale: 1, rotationX: 0, y: 0, duration: 0.5, stagger: 0.02, ease: 'power2.out' },
                "-=0.3"
            )
            // Salida de la pantalla de intro (desvanecimiento) en 0.4s
            .to('#introScreen', {
                opacity: 0,
                duration: 0.4,
                delay: 0.3,
                onComplete: () => {
                    document.getElementById('introScreen').style.display = 'none';
                }
            });
        });

        // Inicialización de Tilt 3D
        VanillaTilt.init(document.querySelectorAll("[data-tilt]"));
    </script>
</body>
</html>
