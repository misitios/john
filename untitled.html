<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación Fotorrealista - Avatar 3D y Calle Real</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #050505;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Overlay UI */
        .overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 15, 25, 0.75);
            backdrop-filter: blur(12px);
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-size: 14px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f2fe;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #090d16;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 20;
            transition: opacity 0.8s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #00f2fe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <!-- Import Map para cargar Three.js directamente desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <p>Cargando Entorno Fotorrealista y Avatar 3D Humano...</p>
    </div>

    <div id="canvas-container">
        <div class="overlay">
            <div class="dot"></div>
            <span>Estado de Animación: <strong id="status-tag" style="color:#00f2fe;">Cargando escena...</strong></span>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('canvas-container');
        const statusTag = document.getElementById('status-tag');
        const loadingEl = document.getElementById('loading');

        // 1. ESCENA, CÁMARA Y RENDERIZADOR
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.3, 3.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        // 2. FONDO FOTORREALISTA (Calle Real)
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(
            'https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=2000&auto=format&fit=crop', 
            (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.background = texture;
            }
        );

        // 3. ILUMINACIÓN Y SOMBRAS
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5ea, 2.5);
        sunLight.position.set(5, 10, 5);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0001;
        scene.add(sunLight);

        // Piso invisible para proyectar la sombra del avatar en el asfalto
        const shadowFloorGeo = new THREE.PlaneGeometry(20, 20);
        const shadowFloorMat = new THREE.ShadowMaterial({ opacity: 0.45 });
        const shadowFloor = new THREE.Mesh(shadowFloorGeo, shadowFloorMat);
        shadowFloor.rotation.x = -Math.PI / 2;
        shadowFloor.position.y = 0;
        shadowFloor.receiveShadow = true;
        scene.add(shadowFloor);

        // 4. CARGA DEL AVATAR HUMANO 3D
        let avatar, headBone;
        const gltfLoader = new GLTFLoader();

        const avatarUrl = 'https://models.readyplayer.me/6460d37574a568b8715691d6.glb?pose=v2';

        gltfLoader.load(
            avatarUrl,
            (gltf) => {
                avatar = gltf.scene;
                avatar.scale.set(1, 1, 1);
                avatar.position.set(0, 0, 0);

                avatar.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                    if (child.isBone && child.name.includes('Head')) {
                        headBone = child;
                    }
                });

                scene.add(avatar);

                loadingEl.style.opacity = '0';
                setTimeout(() => loadingEl.remove(), 800);
            },
            undefined,
            (error) => {
                console.error("Error cargando el modelo 3D:", error);
            }
        );

        // 5. BUCLE INFINITO Y ROTACIÓN DE MIRADA
        const clock = new THREE.Clock();
        let targetHeadRotationY = 0;
        let currentHeadRotationY = 0;
        let currentStateText = "Caminando hacia adelante";

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const cycleTime = elapsedTime % 8; // Ciclo de 8 segundos

            // Máquina de estados
            if (cycleTime < 3) {
                targetHeadRotationY = 0;
                currentStateText = "Caminando mirando al frente";
            } else if (cycleTime >= 3 && cycleTime < 4.5) {
                targetHeadRotationY = 0.55; // Giro izquierda
                currentStateText = "Girando cabeza a la izquierda";
            } else if (cycleTime >= 4.5 && cycleTime < 6.5) {
                targetHeadRotationY = -0.55; // Giro derecha
                currentStateText = "Girando cabeza a la derecha";
            } else {
                targetHeadRotationY = 0;
                currentStateText = "Regresando la mirada al frente";
            }

            // Suavizado del movimiento de cabeza
            currentHeadRotationY += (targetHeadRotationY - currentHeadRotationY) * 0.05;

            if (headBone) {
                headBone.rotation.y = currentHeadRotationY;
            }

            // Ritmo corporal de la caminata
            if (avatar) {
                const walkCycle = elapsedTime * 8;
                avatar.position.y = Math.abs(Math.sin(walkCycle)) * 0.025;
                avatar.rotation.z = Math.sin(walkCycle * 0.5) * 0.015;
            }

            statusTag.textContent = currentStateText;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
